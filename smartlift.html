<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lift Lab — Normal Lift Simulation</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main>
    <section id="left">
      <div class="section-heading">
        <div>
          <p class="eyebrow">LIVE SHAFT</p>
          <h2>Lift position</h2>
        </div><span class="floor-chip" id="current-floor-label">G FLOOR</span>
      </div>
      <div id="shaft" aria-label="elevator shaft"></div>
    </section>

    <section id="right">
      <div class="panel">
        <p class="hint">Choose a direction on any floor, then advance one movement at a time.</p>
        <div id="floor-controls"></div>

        <div class="hr"></div>

        <div class="small-buttons">
          <button id="btn-step">STEP</button><button id="btn-run">AUTO RUN</button><button id="btn-stop">PAUSE</button>
          <button id="btn-reset">Reset</button>
        </div>

      </div>
    </section>

    <section id="ins" class="panel">
      <div class="led-screen"><span id="led-text">G</span></div>
      <h3 id="text">Doors closed</h3>
      <div class="door-controls">
        <button id="grid5" aria-label="Open doors"><span class="door-icon open-icon"></span>OPEN</button><button
          id="gridclose" aria-label="Close doors"><span class="door-icon close-icon"></span>CLOSE</button>
      </div>
      <div id="in-lift-buttons" class="in-lift-panel"></div>
      <div id="pplinlift">a</div>
    </section>
  </main>

  <section id="monitoring-section">
    <div id="info">
      <p class="eyebrow">LIVE STATUS</p>
      <h2>System status</h2>
      <pre id="status"></pre>
    </div>
    <div id="log-section">
      <div class="section-heading">
        <div>
          <p class="eyebrow">EVENT STREAM</p>
          <h2>Lift log</h2>
        </div><span id="log-count">0 EVENTS</span>
      </div>
      <ol id="event-log"></ol>
    </div>
  </section>

  <script src="script.js"></script>
</body>

</html>
